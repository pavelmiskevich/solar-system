<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Солнечная система</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ffd27a'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%236f86c8' stroke-width='1.4' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='29' cy='11' r='2' fill='%238fb2ff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --ui-fg: rgba(233, 240, 255, 0.92);
        --ui-dim: rgba(233, 240, 255, 0.5);
        --ui-bg: rgba(10, 14, 24, 0.55);
        --ui-border: rgba(150, 180, 255, 0.16);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        color: var(--ui-fg);
      }

      #viewport {
        position: fixed;
        inset: 0;
        display: block;
      }

      /*
       * touch-action: none — чтобы браузер не забирал жест себе. Без этого
       * горизонтальное движение пальца по сцене уходит в прокрутку страницы
       * и до свайпа по остановкам экскурсии дело не доходит.
       */
      #viewport canvas { display: block; touch-action: none; }

      /* Слой меток и интерфейса поверх канваса. */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      /* Подпись тела: имя и расстояние, слева — выноска к диску. */
      .label {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform, opacity;
        white-space: nowrap;
        font-size: 12px;
        line-height: 1.25;
        letter-spacing: 0.04em;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }

      /* Подпись — она же кнопка перелёта: по ней проще попасть, чем по точке. */
      .label {
        pointer-events: auto;
        cursor: pointer;
      }

      /*
       * Подсветка тела под курсором. Наведение считается не браузером, а
       * сценой: попасть курсором по планете в доли пикселя нельзя, и то, во
       * что попадёт щелчок, знает только выбор по экрану. Поэтому подсвечивает
       * класс, а не `:hover` — иначе подсветилось бы одно, а улетели бы к
       * другому.
       */
      .label.highlight b { color: #fff; }
      .label.highlight i { color: var(--ui-fg); }
      .label.highlight::before { background: rgba(255, 255, 255, 0.75); }

      .label b {
        display: block;
        font-weight: 500;
        color: var(--ui-fg);
      }

      .label i {
        display: block;
        font-style: normal;
        font-size: 10px;
        color: var(--ui-dim);
        font-variant-numeric: tabular-nums;
      }

      /* Выноска: отрезок постоянной длины под 45° вниз-влево, к краю диска. */
      .label::before {
        content: '';
        position: absolute;
        left: -1px;
        top: 50%;
        width: 20px;
        height: 1px;
        background: linear-gradient(
          to right,
          rgba(233, 240, 255, 0.45) 0%,
          rgba(233, 240, 255, 0) 100%
        );
        transform-origin: 0 50%;
        transform: rotate(135deg);
      }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--ui-bg);
        border: 1px solid var(--ui-border);
        backdrop-filter: blur(12px);
        font-size: 12px;
        line-height: 1.7;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        white-space: pre;
        pointer-events: none;
        opacity: 0.9;
      }

      #hud b { font-weight: 600; color: var(--ui-fg); }
      #hud span { color: var(--ui-dim); }
      /* Расстояние внутри значения — такое же значение, а не подпись к нему. */
      #hud b .unit-toggle { color: var(--ui-fg); }

      /*
       * Подсказка по управлению, а во время экскурсии — рассказ о теле. Второе
       * длиннее первого в разы, и без ограничения ширины плашка вылезала бы
       * за оба края экрана: она приклеена к середине и растёт в обе стороны.
       */
      #hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        max-width: min(680px, calc(100vw - 32px));
        box-sizing: border-box;
        text-align: center;
        padding: 10px 18px;
        border-radius: 18px;
        background: var(--ui-bg);
        border: 1px solid var(--ui-border);
        backdrop-filter: blur(12px);
        font-size: 13px;
        letter-spacing: 0.01em;
        color: var(--ui-dim);
        transition: opacity 0.6s ease;
        pointer-events: none;
      }

      #hint.hidden { opacity: 0; }

      /* Прицел: пока мышь захвачена, выбор идёт по центру кадра. */
      #reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      body.locked #reticle { opacity: 0.55; }

      #reticle::before,
      #reticle::after {
        content: '';
        position: absolute;
        background: rgba(233, 240, 255, 0.85);
      }

      #reticle::before { left: 50%; top: 0; width: 1px; height: 7px; }
      #reticle::after { left: 50%; bottom: 0; width: 1px; height: 7px; }

      /* Кнопки поддержки и справки стоят над списком тел и оформлены так же:
         вид у всех трёх один, различает их подпись. Отдельного правила нужно
         одно — состояние «открыто». */
      .help-toggle.active,
      .support-toggle.active {
        border-color: rgba(150, 180, 255, 0.45);
        background: rgba(20, 28, 48, 0.72);
      }

      /* Сердце в подписи — единственное цветное пятно в интерфейсе, и это
         оправданно: кнопка просит, а не сообщает, и должна отличаться. */
      .support-toggle { color: #d9c4ff; }

      /* Ссылка на исходники: та же таблетка, но со значком, поэтому нужен
         флекс — без него значок и подпись разъезжаются по базовой линии. */
      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: var(--ui-dim);
      }

      .source-link:hover { color: var(--ui-fg); }

      /* Справка: карточка по центру, фон затемнён и кликабелен для закрытия. */
      /* Модальная карточка: затемнение на весь экран и панель по центру.
         Правила общие для справки и поддержки — это одна и та же карточка с
         разным содержимым, и скопированный второй раз блок разошёлся бы с
         первым при первой же правке. */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(4, 6, 12, 0.55);
        pointer-events: auto;
        transition: opacity 0.2s ease;
        z-index: 5;
      }

      .overlay.closed {
        opacity: 0;
        pointer-events: none;
      }

      .overlay-card {
        width: min(760px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 22px 26px 20px;
        border-radius: 14px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.94);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }

      .overlay-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .overlay-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ui-fg);
      }

      .overlay-close {
        border: 1px solid var(--ui-border);
        background: transparent;
        color: var(--ui-dim);
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
      }

      .overlay-close:hover { color: var(--ui-fg); border-color: rgba(150, 180, 255, 0.4); }

      .help-columns {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 6px 28px;
      }

      .help-columns h2 {
        margin: 12px 0 6px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(150, 180, 255, 0.65);
      }

      .help-row {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 10px;
        align-items: baseline;
        padding: 3px 0;
        font-size: 12.5px;
      }

      .help-keys { white-space: nowrap; }
      .help-what { color: var(--ui-dim); }

      .overlay-card kbd {
        display: inline-block;
        min-width: 20px;
        padding: 2px 6px;
        border-radius: 5px;
        border: 1px solid rgba(150, 180, 255, 0.22);
        border-bottom-width: 2px;
        background: rgba(150, 180, 255, 0.09);
        font: inherit;
        font-size: 11px;
        text-align: center;
        color: var(--ui-fg);
      }

      .help-footer {
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px solid rgba(150, 180, 255, 0.12);
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--ui-dim);
      }

      /* Карточка поддержки. Уже справки: содержимого меньше, и растянутый на
         760 пикселей QR-код с двумя строками текста выглядел бы пустым. */
      #support .overlay-card { width: min(520px, 100%); }

      .support-lead {
        margin: 0 0 16px;
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ui-dim);
      }

      .support-body {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid rgba(150, 180, 255, 0.14);
        background: rgba(150, 180, 255, 0.04);
      }

      /* Ссылка на QR-коде: сам код — тоже кнопка, по нему кликают чаще, чем
         кажется, поэтому он подсвечивается при наведении наравне с кнопкой. */
      .support-qr {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-radius: 10px;
        border: 1px solid rgba(150, 180, 255, 0.16);
        background: rgba(10, 14, 24, 0.6);
        text-decoration: none;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .support-qr:hover {
        border-color: rgba(150, 180, 255, 0.45);
        transform: scale(1.03);
      }

      /* Светлая подложка обязательна: QR читается сканером только по контрасту,
         а тёмный код на тёмном фоне не распознаётся вовсе. */
      .support-qr img {
        display: block;
        width: 104px;
        height: 104px;
        padding: 6px;
        border-radius: 6px;
        background: #eef1fa;
      }

      .support-qr span {
        font-size: 10.5px;
        letter-spacing: 0.02em;
        color: var(--ui-dim);
      }

      .support-actions {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .support-actions p { margin: 0; font-size: 12.5px; }
      .support-actions .support-methods { font-size: 11.5px; line-height: 1.5; color: var(--ui-dim); }
      .support-actions b { font-weight: 600; color: var(--ui-fg); }

      .support-pay {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(155, 107, 255, 0.55);
        background: rgba(155, 107, 255, 0.16);
        color: var(--ui-fg);
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.02em;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .support-pay:hover {
        background: rgba(155, 107, 255, 0.28);
        border-color: rgba(180, 145, 255, 0.75);
      }

      .support-share {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 14px 0 0;
        padding-top: 12px;
        border-top: 1px solid rgba(150, 180, 255, 0.12);
        font-size: 11.5px;
        color: var(--ui-dim);
      }

      .support-copy {
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid var(--ui-border);
        background: transparent;
        color: var(--ui-fg);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .support-copy:hover {
        border-color: rgba(150, 180, 255, 0.4);
        background: rgba(20, 28, 48, 0.72);
      }

      /* Слой интерфейса поверх сцены: сам мышь не ловит, ловят только кнопки. */
      #panel {
        position: fixed;
        inset: 0;
        /* Снизу оставлено место подсказке, идущей поперёк экрана. */
        padding: 16px 16px 60px;
        display: flex;
        justify-content: flex-end;
        align-items: flex-start;
        pointer-events: none;
        overflow: hidden;
      }

      /* Список тел. Свёрнутый — одна кнопка у правого края. */
      #bodies {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        max-height: 100%;
        pointer-events: none;
        font-size: 12px;
        /* Выше затемнения открытой карточки (`.overlay`, z-index 5). Иначе
           карточка растянута на весь экран и перехватывает клики по кнопкам:
           подпись «Справка ✕» обещает закрытие, а нажать её невозможно, и
           переключение с одной панели на другую требует двух кликов вместо
           одного. */
        position: relative;
        z-index: 6;
        /* Собственный слой композитора: панель лежит поверх канваса,
           который перерисовывается каждый кадр, и без отдельного слоя её приходится
           растрировать вместе с ним. */
        will-change: transform;
      }

      .bodies-toggle {
        pointer-events: auto;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.82);
        color: var(--ui-fg);
        font: inherit;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .bodies-toggle:hover {
        border-color: rgba(150, 180, 255, 0.4);
        background: rgba(20, 28, 48, 0.72);
      }

      /* Выпадающая панель колонки: общий вид у списка тел и списка видов. */
      .panel-list {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        width: 268px;
        max-height: 55vh;
        overflow-y: auto;
        padding: 6px;
        border-radius: 12px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.86);
        transform-origin: top right;
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      /* Готовые виды: своя карточка в той же колонке, что список тел. */
      .views {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .views-list {
        max-height: 55vh;
        transition: opacity 0.22s ease, transform 0.22s ease, max-height 0.22s ease;
      }

      /*
       * Свёрнутая панель не занимает места. Список тел может позволить себе
       * гаснуть одной прозрачностью — он последний в колонке, и пустая
       * высота под ним никому не мешает. Виды стоят первыми, и та же пустота
       * сдвинула бы вниз все кнопки разом.
       */
      .views.closed .views-list {
        opacity: 0;
        transform: scale(0.94) translateY(-6px);
        pointer-events: none;
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-width: 0;
        overflow: hidden;
      }

      /* Строка вида: имя и под ним подсказка, на что смотреть. */
      .views-row {
        display: block;
        text-align: right;
        line-height: 1.35;
      }

      .views-hint {
        display: block;
        color: var(--ui-dim);
        font-size: 10px;
      }

      /* Свёрнутая панель не должна ловить мышь: она мешала бы полёту. */
      #bodies.closed .bodies-list {
        opacity: 0;
        transform: scale(0.94) translateY(-6px);
        pointer-events: none;
      }

      /* Карточка тела: под списком, в той же колонке. */
      .body-card {
        pointer-events: auto;
        width: 300px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.86);
        font-variant-numeric: tabular-nums;
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      .body-card.hidden {
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
      }

      .body-card-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(150, 180, 255, 0.12);
      }

      .body-card-header b { font-weight: 600; letter-spacing: 0.03em; }

      .body-card-header i {
        font-style: normal;
        font-size: 10px;
        color: var(--ui-dim);
      }

      .body-card-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
        font-size: 11.5px;
        color: var(--ui-dim);
      }

      .body-card-row .value { color: var(--ui-fg); text-align: right; }

      /*
       * Показание расстояния, по которому можно щёлкнуть, чтобы сменить
       * единицы. Пунктир, а не сплошное подчёркивание: сплошное здесь читалось
       * бы как ссылка наружу, а это переключатель на месте.
       */
      .unit-toggle {
        /*
         * HUD целиком прозрачен для мыши, чтобы не отнимать угол экрана у
         * сцены. Показание расстояния — единственное, что там нажимается.
         */
        pointer-events: auto;
        cursor: pointer;
        text-decoration: underline dotted rgba(150, 180, 255, 0.45);
        text-underline-offset: 3px;
      }

      .unit-toggle:hover,
      .unit-toggle:focus-visible {
        color: #cfe0ff;
        text-decoration-color: rgba(150, 180, 255, 0.9);
      }

      .unit-toggle:focus-visible { outline: 1px solid rgba(150, 180, 255, 0.6); outline-offset: 2px; }

      /*
       * Подпись рода и состав атмосферы в одну строку не влезают, и строка,
       * которой в этом теле не существует, убирается целиком: прочерк на
       * месте числа спутников у Луны читался бы как «ноль».
       */
      .body-card-row.hidden,
      .body-card-note.hidden { display: none; }

      .body-card-note {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(150, 180, 255, 0.12);
        font-size: 11px;
        line-height: 1.45;
        color: var(--ui-dim);
      }

      /* Строка выпадающей панели: общий вид у списка тел и списка видов. */
      .panel-row {
        padding: 7px 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--ui-fg);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .panel-row:hover { background: rgba(150, 180, 255, 0.12); }
      .panel-row.active { background: rgba(150, 180, 255, 0.2); }

      .bodies-row {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        grid-template-areas: 'dot name distance' '. kind kind';
        align-items: center;
        gap: 2px 9px;
      }

      .bodies-row .dot {
        grid-area: dot;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 8px currentColor;
      }

      .bodies-row .name { grid-area: name; letter-spacing: 0.02em; }

      .bodies-row .kind {
        grid-area: kind;
        font-size: 10px;
        color: var(--ui-dim);
      }

      .bodies-row .distance {
        grid-area: distance;
        color: var(--ui-dim);
        font-variant-numeric: tabular-nums;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
        background: #000;
        transition: opacity 0.8s ease;
        z-index: 10;
      }

      #loader.done { opacity: 0; pointer-events: none; }

      #loader .title {
        font-size: 13px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--ui-dim);
      }

      #loader .bar {
        width: 180px;
        height: 1px;
        background: rgba(150, 180, 255, 0.18);
        overflow: hidden;
      }

      #loader .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: rgba(190, 215, 255, 0.85);
        animation: sweep 1.4s ease-in-out infinite;
      }

      @keyframes sweep {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      /* Ползунок скорости времени в справке */
      /* Ввод даты: поле, подпись про всемирное время и ряд стрелок. */
      .date-panel {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }

      .date-input {
        flex: 1 1 auto;
        min-width: 170px;
        padding: 4px 6px;
        border-radius: 8px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.82);
        color: var(--ui-fg);
        font: inherit;
        font-variant-numeric: tabular-nums;
      }

      /* Календарь браузера тёмный: иначе он выпадает белым пятном на сцену. */
      .date-input::-webkit-calendar-picker-indicator {
        filter: invert(0.8);
        cursor: pointer;
      }

      .date-label {
        color: var(--ui-dim);
        font-size: 11px;
        letter-spacing: 0.08em;
      }

      .date-buttons {
        display: flex;
        flex: 1 1 100%;
        gap: 4px;
      }

      .date-step {
        flex: 1 1 0;
        padding: 4px 0;
        border-radius: 8px;
        border: 1px solid var(--ui-border);
        background: rgba(10, 14, 24, 0.82);
        color: var(--ui-fg);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .date-step:hover {
        border-color: rgba(150, 180, 255, 0.4);
        background: rgba(20, 28, 48, 0.72);
      }

      .time-slider-wrapper {
        margin-top: 8px;
        position: relative;
        padding-bottom: 16px;
      }
      .time-slider-wrapper input[type=range] {
        width: 100%;
        margin: 0;
        cursor: pointer;
      }
      .time-slider-marks {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 12px;
        pointer-events: none;
      }
      .time-slider-mark {
        position: absolute;
        font-size: 10px;
        color: var(--ui-dim);
        transform: translateX(-50%);
        white-space: nowrap;
      }
      /* Конец ползунка */
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="overlay"></div>
    <div id="hud"></div>
    <div id="panel"></div>
    <div id="reticle"></div>
    <div id="hint"></div>
    <div id="loader">
      <div class="title">Солнечная система</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
