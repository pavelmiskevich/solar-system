# Проверка кода на каждый push в main и на каждый pull request.
#
# Быстрая проверка отдельно от сквозной: типы с юнит-тестами укладываются в
# полминуты, сквозные тесты идут полчаса. Слитые в одно задание, они дали бы
# полчаса ожидания вместо полминуты, и падение быстрой проверки пришлось бы
# ждать всё это время.
#
# Сквозная проверка, в свою очередь, разложена на три доли — см. `shard` ниже.
#
# Версии действий закреплены по SHA, а не по тегу. Тег подвижен: владелец
# репозитория может перенести его на другой коммит, и это известный способ
# атаки на цепочку сборки. Обновляет их Dependabot — см. .github/dependabot.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Меньше прав по умолчанию не бывает: заданиям нужно только читать код.
permissions:
  contents: read

# Новый push в ту же ветку отменяет предыдущий прогон: проверять код, который
# уже заменён, незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Проверка укладывается в полминуты. Ограничение не про неё, а про
    # зависшую ступень: без него застрявшая установка держит исполнителя
    # шесть часов — столько GitHub ждёт по умолчанию, прежде чем оборвать.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Именно ci, а не install: он ставит ровно то, что записано в lock-файле,
      # и падает, если lock разошёлся с package.json.
      - run: npm ci

      - name: Типы
        run: npm run typecheck

      - name: Юнит-тесты
        run: npm test

      - name: Сборка
        run: npm run build

  # Набор сквозных тестов делится между несколькими runner. Причина не в
  # тестах, а в том, на чём они идут: видеокарты на runner нет, сцена считается
  # программным растеризатором, и время уходит на кадры. Ускорить их нечем —
  # значит, остаётся считать кадры на трёх машинах сразу.
  #
  # Внутри каждой доли по-прежнему один воркер: `workers: 1` и
  # `fullyParallel: false` в playwright.config.ts стоят намеренно — несколько
  # воркеров на одной машине делят один растеризатор и мешают друг другу.
  # Разделение между машинами этому не противоречит: у каждой свой.
  shard:
    name: сквозные ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # Предел — сторож для зависшей ступени, а не мерка для прогона, и ставить
    # его впритык к измеренному времени нельзя. Первая же попытка это доказала:
    # двадцать минут против измеренных восемнадцати с половиной выглядели
    # запасом, но одна добавленная проверка съела его целиком, и доля была
    # отменена на 20:16, пройдя двадцать восемь проверок из двадцати девяти.
    #
    # Доли делятся по счёту проверок, а не по времени — времени Playwright
    # заранее не знает, — и разброс между ними настоящий: 7:36, 14:06 и 20:16
    # на одном и том же прогоне. Самая длинная доля и задаёт этот предел.
    # Тридцать минут дают ей полуторный запас и всё равно вдвое меньше тех
    # сорока пяти, что уходили на неразделённый набор.
    #
    # Когда упрёмся снова, чинить надо будет не пределом, а разбросом: четвёртой
    # долей или делением по замеренному времени, а не по числу проверок.
    timeout-minutes: 30
    strategy:
      # Упавшая доля не отменяет остальные: иначе от двух третей набора не
      # останется ни результата, ни отчёта, и разбирать падение будет не по чему.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Браузер весит около полутора сотен мегабайт, и качать его каждый раз
      # дольше, чем прогонять сами тесты.
      - name: Кэш браузера
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка браузера
        run: npx playwright install --with-deps chromium

      # Видеокарты на runner нет, и сцена идёт на программном растеризаторе.
      # Флаги для этого уже прописаны в playwright.config.ts — там же retries и
      # reuseExistingServer смотрят на переменную CI, которую GitHub задаёт сам.
      - name: Сквозные тесты
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Отчёт нужен только когда что-то упало: в нём трассировки и снимки
      # экрана на момент падения, без них разбирать нечего. Имя обязано
      # различаться по долям — иначе выкладка второй затрёт первую.
      - name: Отчёт о падении
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Свод по долям.
  #
  # Задание не делает работы и существует ради имени: защита main требует
  # проверку `e2e`, а матрица даёт «сквозные 1/3», «сквозные 2/3» и «сквозные
  # 3/3» — имени `e2e` среди них нет, и слияние ждало бы его вечно. Здесь оно и
  # появляется, зелёное ровно тогда, когда зелены все доли.
  e2e:
    name: e2e
    needs: shard
    # Без этого свод не запустится вовсе, когда доля упала, и проверка
    # останется висеть в ожидании вместо того, чтобы покраснеть.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Шаг выполняется только тогда, когда сводить нечего: любая доля не
      # зелена — задание падает. Условием, а не подстановкой значения в
      # команду: подставлять в оболочку то, что пришло из контекста, —
      # привычка, которая однажды подставит туда не результат задания.
      - name: Доля не прошла
        if: needs.shard.result != 'success'
        run: exit 1
