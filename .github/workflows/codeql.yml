# Статический анализ CodeQL.
#
# Ищет не стилистические огрехи, а классы дефектов: непроверенный ввод, утечки,
# небезопасные обращения. Для проекта без сервера и без ввода извне улов
# заведомо небогатый, но стоит он одного прогона в неделю, а пропущенная
# небезопасная работа с DOM или зависимостью обходится дороже.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Раз в неделю: правила CodeQL обновляются и находят в неизменившемся коде
    # то, чего не умели находить раньше.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Право на запись нужно только для отправки найденного во вкладку
      # безопасности — больше ни для чего.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Инициализация
        uses: github/codeql-action/init@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          languages: javascript-typescript
          # Расширенный набор: базовый пропускает многое из того, ради чего
          # анализатор и заводят.
          queries: security-extended

      - name: Анализ
        uses: github/codeql-action/analyze@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
