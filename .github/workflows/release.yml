# Выпуск по тегу: сборка, GitHub Release и выкладка на сервер.
#
# Почему по тегу, а не с каждого push в main: тег - единственное, на что можно
# сослаться и к чему откатиться. Сборка с main даёт версию «какой-то SHA», и на
# вопрос «что сейчас на сервере» ответа нет.
name: Release

on:
  push:
    tags: ['v*']

  # Ручной запуск для тега, выпуск по которому не довёлся до конца. Событие
  # push для тега случается один раз, и без этого входа единственный способ
  # переиграть сорвавшийся выпуск - удалить тег и поставить заново, то есть
  # переписать то, на что уже можно было сослаться.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска, например v0.4.0'
        required: true
        type: string

permissions:
  contents: read

# Два прогона одного тега (push и ручной перезапуск) идут по очереди, а не
# вперемешку. Обрывать начатый выпуск нельзя: оборванный посреди выкладки, он
# оставит на сервере полузалитый каталог. Разные теги эта группа не разводит,
# для них ниже своя группа у задания deploy.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Тег ставится вручную и может уехать на коммит, который никто не проверял.
  # Поэтому выпуск начинается с той же проверки, что и обычный push.
  verify:
    name: verify
    runs-on: ubuntu-latest
    # Обычно минута-две. Без предела зависший шаг держит задание шесть часов.
    timeout-minutes: 10
    steps:
      # Имя тега дальше становится частью путей и команд на сервере
      # (mkdir, rsync --delete, ln). Поставить тег может только владелец, так
      # что это предохранитель от опечатки, а не от злоумышленника. Проверка
      # идёт до checkout: строка с кавычкой или пробелом уронила бы его с
      # невнятной ошибкой, а здесь видно, что не так.
      #
      # Предвыпускные теги вида v1.0.0-rc.1 шаблон не пропускает нарочно:
      # понадобятся - расширять его осознанно.
      - name: Имя тега
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # Сверка средствами bash, а не grep: grep смотрит строки по одной, и
        # значение «v1.2.3, перевод строки, что угодно» прошло бы по первой.
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::тег '$TAG' не похож на vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # Вся история нужна для проверки «тег лежит на main»: на обрезанной
          # до одного коммита merge-base не найдёт предка никогда.
          fetch-depth: 0

      # Порядок выпуска держится на том, что тег ставят руками на коммит
      # «Версия X» в main. Ошибиться коммитом легко, и тогда выложится либо
      # сборка со старой версией в package.json, либо ветка, не прошедшая
      # сквозных тестов: здесь гоняются только типы и юнит-тесты.
      - name: Тег совпадает с версией и лежит на main
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Ручной запуск принимает любую строку, в том числе имя ветки,
          # совпавшее с шаблоном. Выпускается только настоящий тег.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::тега $TAG нет в репозитории"; exit 1; }

          PKG=$(node -p "require('./package.json').version")
          if [ "v$PKG" != "$TAG" ]; then
            echo "::error::тег $TAG, а в package.json версия $PKG"
            exit 1
          fi

          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/main; then
            echo "::error::коммит тега $TAG не лежит на main"
            exit 1
          fi

          echo "тег $TAG: версия совпадает, коммит на main"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Единственное задание, которому нужна запись: оно создаёт Release.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Версия из тега
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Архив сборки
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: tar -czf "solar-system-$VERSION.tar.gz" -C dist .

      # Через gh, а не через стороннее действие: он предустановлен на runner, и
      # это на одну внешнюю зависимость в цепочке сборки меньше.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          # Создаём релиз, только если его ещё нет. Голое `gh release create`
          # падает на уже существующем, и однажды это стоило целого выпуска:
          # релиз создали руками, чем поставили тег, тег запустил этот
          # workflow, тот попытался создать релиз второй раз и упал, а вместе
          # с ним не состоялась и выкладка. Кто первым дошёл до релиза, не
          # важно; важно, чтобы в итоге на нём висел архив сборки.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "релиз $VERSION уже создан, догружаю архив сборки"
            gh release upload "$VERSION" "solar-system-$VERSION.tar.gz" --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "solar-system-$VERSION.tar.gz"
          fi

      - name: Сборка для выкладки
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: deploy
    needs: release
    runs-on: ubuntu-latest
    # Выкладка с проверкой занимает около минуты. Пять попыток проверки сайта
    # по 30 секунд и бандл на 60 укладываются с запасом.
    timeout-minutes: 15
    # Ресурс здесь - сервер с одним симлинком current, а не тег. Два разных
    # тега, выпущенных подряд, без этой группы выкладывались бы одновременно,
    # и их mkdir, rsync и перестановки симлинка перемешались бы.
    #
    # Очередь у GitHub на одно место: третий прогон, пришедший следом,
    # вытеснит из ожидания второй. Для выкладки это и нужно - дойдёт самый
    # новый. Порядок тегов при этом не гарантирован: кто раньше дошёл до
    # deploy, тот и выкладывается первым.
    concurrency:
      group: production
      cancel-in-progress: false
    # Секреты лежат в окружении, а не в репозитории: обычным прогонам CI они
    # недоступны, их видит только это задание.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Секреты приходят через env, а не подставляются в текст команды.
      # Подстановка ${{ }} прямо в run вклеивает значение в скрипт до запуска
      # оболочки: перевод строки или кавычка в ключе ломают разбор, а сам ключ
      # оказывается в теле скрипта. Через переменную окружения он остаётся
      # значением и никуда не вклеивается.
      #
      # Ключ пишется в файл, а не передаётся аргументом: аргументы видны в
      # списке процессов на runner.
      - name: Ключ доступа
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # Отпечаток сервера берётся из секрета, а не принимается на веру.
      # StrictHostKeyChecking=no, который стоит в большинстве примеров деплоя,
      # означает согласие подключиться к кому угодно, кто ответит по этому
      # адресу, - то есть отказ от той защиты, ради которой SSH и существует.
      - name: Выкладка
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          # Необязателен: без него берётся стандартный 22.
          PORT: ${{ secrets.DEPLOY_PORT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          # $HOME, а не тильда: строка уходит в rsync через -e, тот разбивает
          # её по пробелам и передаёт ssh как есть - раскрывать тильду там
          # некому. Оболочка же раскрывает $HOME до вызова rsync.
          #
          # Таймауты соединения, а не только задания: сервер, замолчавший
          # посреди сессии, рвётся за минуту с понятной ошибкой ssh, а не через
          # пятнадцать минут невнятным «задание превысило время».
          SSH="ssh -i $HOME/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # Каждый выпуск кладётся в свой каталог. Перестановка симлинка
          # атомарна: пользователь не застанет сайт в полусобранном виде.
          $SSH "$USER@$HOST" "mkdir -p '$ROOT/releases/$VERSION'"
          rsync -az --delete -e "$SSH" dist/ "$USER@$HOST:$ROOT/releases/$VERSION/"
          $SSH "$USER@$HOST" "ln -sfn '$ROOT/releases/$VERSION' '$ROOT/current.new' && mv -T '$ROOT/current.new' '$ROOT/current'"

          # Хранится пять последних: откат - это перестановка симлинка назад,
          # без пересборки и без участия CI.
          #
          # Уборка не имеет права уронить выкладку: сайт к этому моменту уже
          # переключён и работает. Отсюда `|| true` - и он же прикрывает случай
          # первого выпуска, когда удалять ещё нечего и шаблон `*/` остаётся
          # нераскрытым.
          $SSH "$USER@$HOST" "cd '$ROOT/releases' && ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf" || true

      # Проверка, что выложилось именно то и именно туда.
      #
      # Без неё выкладка молчалива: rsync, ln и mv при успехе не печатают
      # ничего, и задание отчитывается зелёным, что бы ни произошло. Один раз
      # это уже стоило дорого - путь в секрете оказался искажён преобразованием
      # путей в Git Bash, файлы уехали в домашний каталог пользователя, и все
      # шаги честно завершились успехом. Ошибка нашлась только осмотром сервера.
      - name: Проверка выкладки
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # Путь обязан быть абсолютным: относительный молча уложит выкладку
          # в домашний каталог, и снаружи это выглядит как успех.
          case "$ROOT" in
            /*) ;;
            *) echo "DEPLOY_PATH не абсолютный путь"; exit 1 ;;
          esac

          TARGET=$($SSH "$USER@$HOST" "readlink '$ROOT/current'")
          echo "current -> $TARGET"

          if [ "$TARGET" != "$ROOT/releases/$VERSION" ]; then
            echo "симлинк указывает не на выложенный выпуск"
            exit 1
          fi

          $SSH "$USER@$HOST" "test -s '$ROOT/current/index.html'" \
            || { echo "index.html отсутствует или пуст"; exit 1; }

          echo "выложено: $VERSION"

      # Последняя проверка - не по файлам на сервере, а по самому адресу.
      #
      # Всё, что было до неё, смотрит на файловую систему: симлинк переставлен,
      # index.html не пуст. Между этим файлом и посетителем стоит Caddy, и о нём
      # предыдущие шаги не знают ничего - отдай он не тот каталог или старое из
      # кеша, выкладка всё равно отчиталась бы зелёным.
      - name: Сайт отдаёт новую сборку
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          BASE="${SITE%/}"

          # Имя бандла содержит хеш содержимого и меняется с каждой сборкой.
          # По нему и отличается «сайт отвечает» от «сайт отдаёт этот выпуск»:
          # старая сборка ответит двухсоткой точно так же.
          BUNDLE=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          [ -n "$BUNDLE" ] || { echo "в собранном index.html не нашлось имени бандла"; exit 1; }
          echo "ожидаем: $BUNDLE"

          # Перезагрузка сервера и посредники берут своё время, поэтому
          # несколько попыток: одна сетевая заминка не должна ронять выпуск.
          # Запрос идёт мимо кеша - иначе проверка подтвердит то, что лежит у
          # посредника, а не то, что выложено.
          FOUND=
          for attempt in 1 2 3 4 5; do
            PAGE=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "$BASE/?deploy-check=$GITHUB_RUN_ID" || true)

            case "$PAGE" in
              *"$BUNDLE"*) FOUND=1; break ;;
            esac

            echo "попытка $attempt: новой сборки на странице ещё нет"
            sleep 10
          done

          [ -n "$FOUND" ] || { echo "сайт не отдаёт выложенную сборку"; exit 1; }
          echo "страница ссылается на $BUNDLE"

          # Страница может ссылаться на бандл, которого нет: тогда адрес
          # открывается, а сцена не появляется - и снаружи это выглядит как
          # чёрный экран, а не как сорванная выкладка.
          curl -fsS --max-time 60 -o bundle.js "$BASE/$BUNDLE"
          SIZE=$(wc -c < bundle.js)
          echo "бандл отдаётся, $SIZE байт"

          # Сцена со всеми каталогами весит под мегабайт. Сотня килобайт - это
          # не «немного меньше», это страница с ошибкой вместо бандла.
          [ "$SIZE" -gt 100000 ] || { echo "бандл подозрительно мал"; exit 1; }

      # Настройка Caddy живёт на сервере, а не в репозитории, и однажды уже
      # разошлась с образцом deploy/Caddyfile.example: страница шла без
      # Cache-Control и без единого заголовка безопасности (#171). Снаружи
      # этого не видно, сайт открывается как обычно. Поэтому каждый выпуск
      # сверяет заголовки страницы с образцом.
      #
      # Политика содержимого принимается и в режиме Report-Only: так её
      # включают сначала, чтобы нарушения были видны, а сайт работал.
      - name: Сайт отдаёт заголовки из образца
        env:
          SITE: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          HEADERS=$(curl -fsS --max-time 20 -o /dev/null -D - "${SITE%/}/" | tr -d '\r' | tr 'A-Z' 'a-z')

          MISSING=
          for expected in \
            'cache-control: no-cache' \
            'x-content-type-options: nosniff' \
            'referrer-policy: strict-origin-when-cross-origin' \
            'permissions-policy: ' \
            'strict-transport-security: max-age=' \
            'content-security-policy'; do
            printf '%s\n' "$HEADERS" | grep -q "^$expected" || MISSING="$MISSING
            $expected"
          done

          if [ -n "$MISSING" ]; then
            echo "::error::на странице нет заголовков (сверить /etc/caddy/Caddyfile с deploy/Caddyfile.example):$MISSING"
            exit 1
          fi
          echo "заголовки на месте"
