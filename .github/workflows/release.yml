# Выпуск по тегу: сборка, GitHub Release и выкладка на сервер.
#
# Почему по тегу, а не с каждого push в main: тег — единственное, на что можно
# сослаться и к чему откатиться. Сборка с main даёт версию «какой-то SHA», и на
# вопрос «что сейчас на сервере» ответа нет.
name: Release

on:
  push:
    tags: ['v*']

  # Ручной запуск для тега, выпуск по которому не довёлся до конца. Событие
  # push для тега случается один раз, и без этого входа единственный способ
  # переиграть сорвавшийся выпуск — удалить тег и поставить заново, то есть
  # переписать то, на что уже можно было сослаться.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска, например v0.4.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Тег ставится вручную и может уехать на коммит, который никто не проверял.
  # Поэтому выпуск начинается с той же проверки, что и обычный push.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Единственное задание, которому нужна запись: оно создаёт Release.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Версия из тега
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Архив сборки
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: tar -czf "solar-system-$VERSION.tar.gz" -C dist .

      # Через gh, а не через стороннее действие: он предустановлен на runner, и
      # это на одну внешнюю зависимость в цепочке сборки меньше.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          # Создаём релиз, только если его ещё нет. Голое `gh release create`
          # падает на уже существующем, и однажды это стоило целого выпуска:
          # релиз создали руками, чем поставили тег, тег запустил этот
          # workflow, тот попытался создать релиз второй раз и упал, а вместе
          # с ним не состоялась и выкладка. Кто первым дошёл до релиза, не
          # важно; важно, чтобы в итоге на нём висел архив сборки.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "релиз $VERSION уже создан, догружаю архив сборки"
            gh release upload "$VERSION" "solar-system-$VERSION.tar.gz" --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes "solar-system-$VERSION.tar.gz"
          fi

      - name: Сборка для выкладки
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: deploy
    needs: release
    runs-on: ubuntu-latest
    # Секреты лежат в окружении, а не в репозитории: обычным прогонам CI они
    # недоступны, их видит только это задание.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Секреты приходят через env, а не подставляются в текст команды.
      # Подстановка ${{ }} прямо в run вклеивает значение в скрипт до запуска
      # оболочки: перевод строки или кавычка в ключе ломают разбор, а сам ключ
      # оказывается в теле скрипта. Через переменную окружения он остаётся
      # значением и никуда не вклеивается.
      #
      # Ключ пишется в файл, а не передаётся аргументом: аргументы видны в
      # списке процессов на runner.
      - name: Ключ доступа
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy"
          chmod 600 "$HOME/.ssh/deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # Отпечаток сервера берётся из секрета, а не принимается на веру.
      # StrictHostKeyChecking=no, который стоит в большинстве примеров деплоя,
      # означает согласие подключиться к кому угодно, кто ответит по этому
      # адресу, — то есть отказ от той защиты, ради которой SSH и существует.
      - name: Выкладка
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          # Необязателен: без него берётся стандартный 22.
          PORT: ${{ secrets.DEPLOY_PORT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          # $HOME, а не тильда: строка уходит в rsync через -e, тот разбивает
          # её по пробелам и передаёт ssh как есть — раскрывать тильду там
          # некому. Оболочка же раскрывает $HOME до вызова rsync.
          SSH="ssh -i $HOME/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # Каждый выпуск кладётся в свой каталог. Перестановка симлинка
          # атомарна: пользователь не застанет сайт в полусобранном виде.
          $SSH "$USER@$HOST" "mkdir -p '$ROOT/releases/$VERSION'"
          rsync -az --delete -e "$SSH" dist/ "$USER@$HOST:$ROOT/releases/$VERSION/"
          $SSH "$USER@$HOST" "ln -sfn '$ROOT/releases/$VERSION' '$ROOT/current.new' && mv -T '$ROOT/current.new' '$ROOT/current'"

          # Хранится пять последних: откат — это перестановка симлинка назад,
          # без пересборки и без участия CI.
          #
          # Уборка не имеет права уронить выкладку: сайт к этому моменту уже
          # переключён и работает. Отсюда `|| true` — и он же прикрывает случай
          # первого выпуска, когда удалять ещё нечего и шаблон `*/` остаётся
          # нераскрытым.
          $SSH "$USER@$HOST" "cd '$ROOT/releases' && ls -1dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf" || true

      # Проверка, что выложилось именно то и именно туда.
      #
      # Без неё выкладка молчалива: rsync, ln и mv при успехе не печатают
      # ничего, и задание отчитывается зелёным, что бы ни произошло. Один раз
      # это уже стоило дорого — путь в секрете оказался искажён преобразованием
      # путей в Git Bash, файлы уехали в домашний каталог пользователя, и все
      # шаги честно завершились успехом. Ошибка нашлась только осмотром сервера.
      - name: Проверка выкладки
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ROOT: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          # Путь обязан быть абсолютным: относительный молча уложит выкладку
          # в домашний каталог, и снаружи это выглядит как успех.
          case "$ROOT" in
            /*) ;;
            *) echo "DEPLOY_PATH не абсолютный путь"; exit 1 ;;
          esac

          TARGET=$($SSH "$USER@$HOST" "readlink '$ROOT/current'")
          echo "current -> $TARGET"

          if [ "$TARGET" != "$ROOT/releases/$VERSION" ]; then
            echo "симлинк указывает не на выложенный выпуск"
            exit 1
          fi

          $SSH "$USER@$HOST" "test -s '$ROOT/current/index.html'" \
            || { echo "index.html отсутствует или пуст"; exit 1; }

          echo "выложено: $VERSION"
